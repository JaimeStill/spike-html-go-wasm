# mise run never installs a missing tool first (task.run_auto_install, on by default): the check
# reads no network, and fails naming mise run install, the one task that installs tools.
# Adapted from spike-html-hosting (690e5e4): mise.toml, its init toolchain and tasks, with Go and
# TinyGo added.
# Adapted from spike-html-hosting-sdk (v0.6.1): template/mise.toml, its toolchain merged with the
# repository's Go, TinyGo, and pnpm pins, its build the hand index alone, and its unit tier the
# empty content.json.
[settings]
task.run_auto_install = false

# The SDK's toolchain at its latest pins, with Go for the GOOS=js builds, golangci-lint for their
# lint, and TinyGo for the comparison build.
[tools]
actionlint = "1.7.12"
go = "1.27.4"
golangci-lint = "2.15.0"
node = "26.13.0"
pnpm = "12.19.0"
shellcheck = "0.11.0"
tinygo = "0.44.0"
"github:microsoft/typescript-go" = { version = "7.0.2", version_prefix = "typescript/v", bin_path = "package/lib" }

# The browser tier's browser. Chrome for Testing publishes no checksums: take the sha256 and size
# from the download by hand at each bump; currency reads the version_list_url through mise outdated.
[tools."http:chrome-headless-shell"]
version = "157.0.8103.50"
version_list_url = "https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions.json"
version_json_path = ".channels.Stable.version"

[tools."http:chrome-headless-shell".platforms]
linux-x64 = { url = "https://storage.googleapis.com/chrome-for-testing-public/{{ version }}/linux64/chrome-headless-shell-linux64.zip", checksum = "sha256:7bf0d41e424efd1d6281c4162993ab9dc5de92fac213c211614905a71c057d0f", size = "128166087" }

[tasks.preflight]
description = "Fail naming mise run install when a tool the tasks need is missing, and with the browser argument the pinned chrome-headless-shell; reads node_modules/.bin, writes nothing"
hide = true
run = "scripts/preflight.sh"
dir = "{{config_root}}"

[tasks.lint]
description = "Run the linters: ESLint (the leftover check on dist/ included), Prettier, shellcheck, actionlint, and the Go lint; reads no network, writes dist/"
depends = ["lint:eslint", "lint:format", "lint:go", "lint:shell", "lint:workflows"]

# The leftover check reads the build, so the lint follows it: with no dist/, it would pass on
# nothing.
[tasks."lint:eslint"]
description = "Lint with ESLint (eslint.config.js, the SDK's configuration): the recommended rules over the code, and the leftover check, no CSS module script in dist/, after the build; reads no network, writes dist/"
depends = ["preflight", "build"]
run = "pnpm exec eslint ."
dir = "{{config_root}}"

[tasks."lint:format"]
description = "Check the code, JSON, and CSS format with Prettier (the SDK's configuration, .prettierignore); reads no network, writes nothing"
depends = ["preflight"]
run = "pnpm exec prettier --check ."
dir = "{{config_root}}"

[tasks."lint:go"]
description = "Lint the Go module under GOOS=js GOARCH=wasm (gofmt, go vet, go fix, go mod tidy, golangci-lint), check web/runtime/wasm_exec.js against the pinned Go's, and fail on any tracked .wasm; reads no network, writes nothing outside Go's caches"
depends = ["preflight"]
run = "scripts/check-go.sh"
dir = "{{config_root}}"

[tasks."lint:shell"]
description = "Shellcheck every .sh file outside node_modules/ and .git/; reads no network, writes nothing"
run = '''
set -eu
find . -name '*.sh' -not -path './node_modules/*' -not -path './.git/*' -print0 \
  | xargs -0 -r shellcheck
'''
dir = "{{config_root}}"

# actionlint shellchecks each run: block too, with the shellcheck pinned above.
[tasks."lint:workflows"]
description = "Lint the GitHub Actions workflows with actionlint; reads no network, writes nothing"
run = "actionlint"
dir = "{{config_root}}"

[tasks.types]
description = "Type-check the configs (tsconfig.json) and the suite (tsconfig.test.json) with tsc; reads no network, writes nothing"
depends = ["types:src", "types:test"]

[tasks."types:src"]
description = "Type-check eslint.config.js and vite.config.ts with tsc; reads no network, writes nothing"
depends = ["preflight"]
run = "tsc -p ."
dir = "{{config_root}}"

[tasks."types:test"]
description = "Type-check the suite, test/'s TypeScript that node --test runs under type stripping, and the capture file, scripts/screenshots.config.ts, with tsc against tsconfig.test.json; reads no network, writes nothing"
depends = ["preflight"]
run = "tsc -p tsconfig.test.json"
dir = "{{config_root}}"

[tasks.build]
description = "Build the site with Vite (vite.config.ts): the hand index, index.html, and the foundation modules it loads into dist/, under the Pages base; then the Go entrypoints for GOOS=js GOARCH=wasm into dist/go/, beside wasm_exec.js (scripts/build-go.sh); reads no network, writes dist/"
depends = ["preflight"]
# Vite empties dist/ first, so the Go step follows it.
run = ["pnpm exec vite build", "scripts/build-go.sh"]
dir = "{{config_root}}"

[tasks."test:unit"]
description = "Run the unit tier under node --test: content/ against content.json, which records no tree, with the SDK's content check; reads no network, writes nothing"
depends = ["preflight"]
run = "node --test 'test/unit/*.test.ts'"
dir = "{{config_root}}"

[tasks."test:browser"]
description = "Run the browser tier after the build, the SDK's checks: dist/ under the base by Vite's preview, in the pinned chrome-headless-shell, the shell checks on the hand index and the crawl from it; and the screenshots command on the index, its captures under a scratch TMPDIR removed after unless --keep; reads no network, writes dist/"
depends = ["preflight browser", "build"]
run = "BROWSER_EXECUTABLE=$(mise which chrome-headless-shell) node --test 'test/browser/*.test.ts'"
dir = "{{config_root}}"

[tasks.check]
description = "Run every check: lint, types, build, test:unit, and test:browser; reads no network, writes dist/ (gitignored) and nothing else outside TMPDIR"
depends = ["lint", "types", "build", "test:unit", "test:browser"]

# Never a dependency of check: a reviewer's look at the site's pages, not a test. The capture is
# spike-html-apps-tooling's spike-html-apps-screenshots, on scripts/screenshots.config.ts; the
# browser tier runs it once (test/browser/screenshots.test.ts).
# Adapted from spike-html-apps-components (19d4f59): mise.toml, its screenshots task.
[tasks.screenshots]
description = "Capture every page whole at 390, 1120, and 1376px, and the index with Help and Settings open at each, light and dark, in tiles, at the defaults, or --palette/--space/--type <name>, or --all; --page <name> (repeatable), --scheme light|dark, --output terminal|directory|browser, --dir <path>, --keep; reads no network, writes dist/ and the captures, under TMPDIR unless --dir"
depends = ["preflight browser", "build"]
# Its arguments follow the description, with or without a leading --.
# raw: with dependencies, mise prefixes a task's output through a pipe; icat needs the terminal.
raw = true
run = "BROWSER_EXECUTABLE=$(mise which chrome-headless-shell) pnpm exec spike-html-apps-screenshots scripts/screenshots.config.ts"
dir = "{{config_root}}"

[tasks.install]
description = "Install every mise.toml pin, node_modules from pnpm-lock.yaml, and go.mod's requirements into the Go module cache; reads the network, writes node_modules/ and the module cache"
run = ["mise install", "pnpm install --frozen-lockfile", "go mod download"]
dir = "{{config_root}}"

# The SDK's currency bin, which a pnpm install links into node_modules/.bin; it replaces
# scripts/currency.sh, whose mise tool report it holds, and go.mod's requirements join it with the
# module.
[tasks.currency]
description = "Report every mise tool, package.json pin (a registry version or a github: tag), and workflow action or reusable workflow pin behind its latest, one line each, exiting nonzero if any; reads the network, writes nothing"
run = "pnpm exec spike-html-hosting-currency"
# Without mise's own command echo, so a current tree prints nothing at all.
quiet = true
dir = "{{config_root}}"
