# mise run never installs a missing tool first (task.run_auto_install, on by default): the check
# reads no network, and fails naming mise run install, the one task that installs tools.
# Adapted from spike-html-hosting (690e5e4): mise.toml, its init toolchain and tasks, with Go
# added.
# Adapted from spike-html-hosting-sdk (v0.6.2): template/mise.toml, its toolchain merged with the
# repository's Go and pnpm pins, its build the hand index alone, and its unit tier the
# empty content.json.
[settings]
task.run_auto_install = false

# The SDK's toolchain at its latest pins, with Go for the GOOS=js builds and golangci-lint for their
# lint.
[tools]
actionlint = "1.7.12"
go = "1.27.4"
golangci-lint = "2.15.0"
node = "26.13.1"
pnpm = "12.19.0"
shellcheck = "0.11.0"
"github:microsoft/typescript-go" = { version = "7.0.2", version_prefix = "typescript/v", bin_path = "package/lib" }

# The browser tier's browser. Chrome for Testing publishes no checksums: take the sha256 and size
# from the download by hand at each bump; currency reads the version_list_url through mise outdated.
[tools."http:chrome-headless-shell"]
version = "157.0.8103.78"
version_list_url = "https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions.json"
version_json_path = ".channels.Stable.version"

[tools."http:chrome-headless-shell".platforms]
linux-x64 = { url = "https://storage.googleapis.com/chrome-for-testing-public/{{ version }}/linux64/chrome-headless-shell-linux64.zip", checksum = "sha256:f90329720fb61e5a76da9b6b509b6ad12a484c9c5df0359403e935177c6d153a", size = "127965683" }

# The browser tier's second font set, a pinned DejaVu set: the layout tests run again under a
# test-only fontconfig (test/browser/fonts.ts) that shows the browser only the six faces of
# Ubuntu's fonts-dejavu-core, so a local run never proves the layout in the machine's fonts alone.
# DejaVu publishes no checksums, so the sha256 and size are taken from the download by hand at each
# bump; currency reads the release assets' names through mise outdated. The archive's LICENSE holds
# its license: Bitstream Vera's, with DejaVu's changes in the public domain.
[tools."http:dejavu-fonts"]
version = "2.37"
version_list_url = "https://api.github.com/repos/dejavu-fonts/dejavu-fonts/releases"
version_regex = 'dejavu-fonts-ttf-([0-9.]+)\.tar\.bz2'

[tools."http:dejavu-fonts".platforms]
linux-x64 = { url = "https://github.com/dejavu-fonts/dejavu-fonts/releases/download/version_{{ version | replace(from='.', to='_') }}/dejavu-fonts-ttf-{{ version }}.tar.bz2", checksum = "sha256:fa9ca4d13871dd122f61258a80d01751d603b4d3ee14095d65453b4e846e17d7", size = "5429777" }

[tasks.preflight]
description = "Fail naming mise run install when a tool the tasks need is missing, and with the browser argument the pinned chrome-headless-shell and DejaVu fonts; reads node_modules/.bin, writes nothing"
hide = true
run = "scripts/preflight.sh"
dir = "{{config_root}}"

[tasks.lint]
description = "Run the linters: ESLint (the leftover check on dist/ included), Prettier, shellcheck, actionlint, and the Go lint; reads no network, writes dist/"
depends = ["lint:eslint", "lint:format", "lint:go", "lint:shell", "lint:workflows"]

# The leftover check reads the build, so the lint follows it: with no dist/, it would pass on
# nothing.
[tasks."lint:eslint"]
description = "Lint with ESLint (eslint.config.js, the SDK's configuration and the web tiers' import table): the recommended rules over the code, the web tiers' direction in web/, and the leftover check, no CSS module script in dist/, after the build; reads no network, writes dist/"
depends = ["preflight", "build"]
run = "pnpm exec eslint ."
dir = "{{config_root}}"

[tasks."lint:format"]
description = "Check the code, JSON, and CSS format with Prettier (the SDK's configuration, .prettierignore); reads no network, writes nothing"
depends = ["preflight"]
run = "pnpm exec prettier --check ."
dir = "{{config_root}}"

[tasks."lint:go"]
description = "Lint the Go module under GOOS=js GOARCH=wasm (gofmt, go vet, go fix, go mod tidy, golangci-lint), check web/runtime/wasm_exec.js against the pinned Go's, fail on any tracked .wasm or .a archive, and run the Go tests as wasm under node in a trimmed environment, on node's fs and again on the runtime's in-memory fs (scripts/go-memfs-exec.sh), test/memfs's program among them, playground/calc's, the playground's starter over its shipped input.txt and a failing script, its output and exit code, playground/basics', its exact output and exit 0, playground/generics', its exact output and exit 0, playground/concurrency', its exact output on every one of several runs and exit 0, and playground/stdlib', its report for its shipped input.json, exit 0, a malformed input.json's one stderr line naming its JSON error and a missing one's, each exit 1, and playground/sqlate's, its statements compiled from its shipped .sql files, a namespace of the reader's included, exit 0, and each catalog or compile error's one stderr line, sqlate's own, exit 1, and playground/graph's, its service's layer table and each participant's start in layer order and stop in reverse, exit 0, a failing constructor's one stderr line, graph's message naming the node, exit 1, and a dependency cycle's panic, graph's message naming its path, exit 2; and internal/sqlate's compile handler, a statement's $n SQL and its line naming its tier and parameters, an app pattern's include and PostgreSQL's, and each compile error rejected with sqlate's message, printing nothing; and internal/websdk's request handler, a raw HTTP/1.1 request's text with LF or CRLF line endings served through go-web-sdk's Router in-process and its response's text, each projects route's status, headers, and body, the request id and a new id by shape and the seeded responses exactly, text that isn't an HTTP/1.1 request rejected naming why with the instance serving the next call, and a create, list, get, update, and stale update chained on one instance; reads no network, writes nothing outside Go's caches and TMPDIR"
depends = ["preflight"]
run = "scripts/check-go.sh"
dir = "{{config_root}}"

[tasks."lint:shell"]
description = "Shellcheck every .sh file outside node_modules/ and .git/; reads no network, writes nothing"
depends = ["preflight"]
run = '''
set -eu
find . -name '*.sh' -not -path './node_modules/*' -not -path './.git/*' -print0 \
  | xargs -0 -r shellcheck
'''
dir = "{{config_root}}"

# actionlint shellchecks each run: block too, with the shellcheck pinned above.
[tasks."lint:workflows"]
description = "Lint the GitHub Actions workflows with actionlint; reads no network, writes nothing"
depends = ["preflight"]
run = "actionlint"
dir = "{{config_root}}"

[tasks.types]
description = "Type-check the configs (tsconfig.json), the web tiers (tsconfig.web.json), and the suite (tsconfig.test.json) with tsc; reads no network, writes nothing"
depends = ["types:src", "types:web", "types:test"]

[tasks."types:src"]
description = "Type-check eslint.config.js and vite.config.ts with tsc; reads no network, writes nothing"
depends = ["preflight"]
run = "tsc -p ."
dir = "{{config_root}}"

[tasks."types:web"]
description = "Type-check web/'s TypeScript, the runtime, its worker, and the page scripts that Vite bundles, with tsc against tsconfig.web.json, the DOM's types and Vite's client types; reads no network, writes nothing"
depends = ["preflight"]
run = "tsc -p tsconfig.web.json"
dir = "{{config_root}}"

[tasks."types:test"]
description = "Type-check the suite, test/'s TypeScript that node --test runs under type stripping, and scripts/'s TypeScript, the capture file and the in-memory fs's Go test host among it, with what they import from web/runtime, with tsc against tsconfig.test.json; reads no network, writes nothing"
depends = ["preflight"]
run = "tsc -p tsconfig.test.json"
dir = "{{config_root}}"

[tasks.build]
description = "Build the site with Vite (vite.config.ts): the hand pages, index.html, components.html, playground.html, and sqlate.html, and the Markdown pages the SDK's markdownPages renders from markdown/ into markdown-shell.html, sqlate-compile.html, go-core-graph.html, and go-web-sdk-handlers.html, the foundation modules they load, the pages' scripts, the components, the code editor's tokenizer with each palette's syntax theme merged into light-dark() colors (scripts/syntax-themes.ts), and the runtime's worker, web/runtime/wasm_exec.js bundled in it, into dist/, under the Pages base; then cmd/'s Go entrypoints, hello, probe, sqlate, and websdk, for GOOS=js GOARCH=wasm into dist/go/ (scripts/build-go.sh), never playground/'s programs, the starter, calc, basics, generics, concurrency, stdlib, sqlate, or graph, and the playground's toolchain into dist/go/toolchain/, Go's compiler and linker built for GOOS=js GOARCH=wasm, an archive for every standard-library package that builds for it, under std/, and for every package of the site's pinned modules the repository's own packages depend on, sqlate's, go-core's, and go-web-sdk's and their dependencies', under mod/, and the manifest naming them, every file but the manifest under its content's hash (scripts/build-toolchain.ts); reads no network, writes dist/"
depends = ["preflight"]
# Vite empties dist/ first, so the Go step follows it.
run = ["pnpm exec vite build", "scripts/build-go.sh"]
dir = "{{config_root}}"

