# mise run never installs a missing tool first (task.run_auto_install, on by default): the check
# reads no network, and fails naming mise run install, the one task that installs tools.
# Adapted from spike-html-hosting (690e5e4): mise.toml, its init toolchain and tasks, with Go and
# TinyGo added.
# Adapted from spike-html-hosting-sdk (v0.6.2): template/mise.toml, its toolchain merged with the
# repository's Go, TinyGo, and pnpm pins, its build the hand index alone, and its unit tier the
# empty content.json.
[settings]
task.run_auto_install = false

# The SDK's toolchain at its latest pins, with Go for the GOOS=js builds, golangci-lint for their
# lint, and TinyGo for the comparison build.
[tools]
actionlint = "1.7.12"
go = "1.27.4"
golangci-lint = "2.15.0"
node = "26.13.1"
pnpm = "12.19.0"
shellcheck = "0.11.0"
tinygo = "0.44.0"
"github:microsoft/typescript-go" = { version = "7.0.2", version_prefix = "typescript/v", bin_path = "package/lib" }

# The browser tier's browser. Chrome for Testing publishes no checksums: take the sha256 and size
# from the download by hand at each bump; currency reads the version_list_url through mise outdated.
[tools."http:chrome-headless-shell"]
version = "157.0.8103.50"
version_list_url = "https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions.json"
version_json_path = ".channels.Stable.version"

[tools."http:chrome-headless-shell".platforms]
linux-x64 = { url = "https://storage.googleapis.com/chrome-for-testing-public/{{ version }}/linux64/chrome-headless-shell-linux64.zip", checksum = "sha256:7bf0d41e424efd1d6281c4162993ab9dc5de92fac213c211614905a71c057d0f", size = "128166087" }

[tasks.preflight]
description = "Fail naming mise run install when a tool the tasks need is missing, and with the browser argument the pinned chrome-headless-shell; reads node_modules/.bin, writes nothing"
hide = true
run = "scripts/preflight.sh"
dir = "{{config_root}}"

[tasks.lint]
description = "Run the linters: ESLint (the leftover check on dist/ included), Prettier, shellcheck, actionlint, and the Go lint; reads no network, writes dist/"
depends = ["lint:eslint", "lint:format", "lint:go", "lint:shell", "lint:workflows"]

# The leftover check reads the build, so the lint follows it: with no dist/, it would pass on
# nothing.
[tasks."lint:eslint"]
description = "Lint with ESLint (eslint.config.js, the SDK's configuration and the web tiers' import table): the recommended rules over the code, the web tiers' direction in web/, and the leftover check, no CSS module script in dist/, after the build; reads no network, writes dist/"
depends = ["preflight", "build"]
run = "pnpm exec eslint ."
dir = "{{config_root}}"

[tasks."lint:format"]
description = "Check the code, JSON, and CSS format with Prettier (the SDK's configuration, .prettierignore); reads no network, writes nothing"
depends = ["preflight"]
run = "pnpm exec prettier --check ."
dir = "{{config_root}}"

[tasks."lint:go"]
description = "Lint the Go module under GOOS=js GOARCH=wasm (gofmt, go vet, go fix, go mod tidy, golangci-lint), check web/runtime/wasm_exec.js against the pinned Go's, fail on any tracked .wasm, and run the Go tests as wasm under node in a trimmed environment, on node's fs and again on the runtime's in-memory fs (scripts/go-memfs-exec.sh), test/memfs's program among them; reads no network, writes nothing outside Go's caches and TMPDIR"
depends = ["preflight"]
run = "scripts/check-go.sh"
dir = "{{config_root}}"

[tasks."lint:shell"]
description = "Shellcheck every .sh file outside node_modules/ and .git/; reads no network, writes nothing"
depends = ["preflight"]
run = '''
set -eu
find . -name '*.sh' -not -path './node_modules/*' -not -path './.git/*' -print0 \
  | xargs -0 -r shellcheck
'''
dir = "{{config_root}}"

# actionlint shellchecks each run: block too, with the shellcheck pinned above.
[tasks."lint:workflows"]
description = "Lint the GitHub Actions workflows with actionlint; reads no network, writes nothing"
depends = ["preflight"]
run = "actionlint"
dir = "{{config_root}}"

[tasks.types]
description = "Type-check the configs (tsconfig.json), the web tiers (tsconfig.web.json), and the suite (tsconfig.test.json) with tsc; reads no network, writes nothing"
depends = ["types:src", "types:web", "types:test"]

[tasks."types:src"]
description = "Type-check eslint.config.js and vite.config.ts with tsc; reads no network, writes nothing"
depends = ["preflight"]
run = "tsc -p ."
dir = "{{config_root}}"

[tasks."types:web"]
description = "Type-check web/'s TypeScript, the runtime, its worker, and the page scripts that Vite bundles, with tsc against tsconfig.web.json, the DOM's types and Vite's client types; reads no network, writes nothing"
depends = ["preflight"]
run = "tsc -p tsconfig.web.json"
dir = "{{config_root}}"

[tasks."types:test"]
description = "Type-check the suite, test/'s TypeScript that node --test runs under type stripping, and scripts/'s TypeScript, the capture file and the in-memory fs's Go test host among it, with what they import from web/runtime, with tsc against tsconfig.test.json; reads no network, writes nothing"
depends = ["preflight"]
run = "tsc -p tsconfig.test.json"
dir = "{{config_root}}"

[tasks.build]
description = "Build the site with Vite (vite.config.ts): the hand pages, index.html and components.html, the foundation modules they load, the pages' scripts, the components, the code editor's tokenizer with each palette's syntax theme merged into light-dark() colors (scripts/syntax-themes.ts), and the runtime's worker, web/runtime/wasm_exec.js bundled in it, into dist/, under the Pages base; then the Go entrypoints for GOOS=js GOARCH=wasm into dist/go/ (scripts/build-go.sh); reads no network, writes dist/"
depends = ["preflight"]
# Vite empties dist/ first, so the Go step follows it.
run = ["pnpm exec vite build", "scripts/build-go.sh"]
dir = "{{config_root}}"

[tasks."test:unit"]
description = "Run the unit tier under node --test: content/ against content.json, which records no tree, with the SDK's content check; the web tiers' import table over a fixture tree, shiki the components' alone; and the Go module's layer direction (go list under GOOS=js GOARCH=wasm) and its go.mod, no replace directive or local-path requirement, on the module and on fixture modules; mise run currency's go.mod part over recorded go list output; mise run live's assertions against local servers on 127.0.0.1, a failing one among them; the runtime's in-memory fs, its calls' error codes and edges, its output routing, and its install; the code editor's settings model, its defaults, validation, and change events; the console's log, each write split into lines, a stream's open line continued and the other stream's kept apart, exits and results, the latest 10,000 entries kept and the count dropped, clear, the refusals naming why, and one change event for each change; and the file set, each operation, the active file after it, its refusals naming why, and one change event for each change and none for a no-op; and the run timings, only the phases recorded, in phase order whatever the arrival, the total, a new run replacing the last, the refusals naming why, and one change event for each change; and the run state, a start numbering a pending run, a finish recording its outcome, a start while pending superseding it as stopped, a superseded run's late finish changing nothing, the refusals naming why, and one change event for each change; and each program demo's go fence on the components page, read from components.html without a browser, equal to its scenario's source byte for byte; and no module under web/components or web/pages importing the foundation's keys.js, whose register() binds a page shortcut, or reaching its store; reads no network, writes nothing outside TMPDIR and Go's caches"
depends = ["preflight"]
run = "node --test 'test/unit/*.test.ts'"
dir = "{{config_root}}"

[tasks."test:browser"]
description = "Run the browser tier after the build: dist/ under the base by Vite's preview, in the pinned chrome-headless-shell, the SDK's shell checks on each hand page, the index and the components page, and the crawl from the index, reaching those two alone; the Go modules served as application/wasm, no Go requested on load, and the runtime's runs through the components page's Go demos over its one runner in one worker, hello's output and exit, probe's format and files, their timings, a held module reused, and scenarios switched in place; Stop ending probe's spin, and the runner's Stop while idle, the next run answering from the kept module with no .wasm fetched and one live worker; a run or load while spin is pending stopping spin first, its demo recording it stopped; a program's Run while a load is pending stopping the load, which rejects as stopped, and a Run while another demo's load of the same scenario is pending leaving the newer load's scenario held, the paused .wasm fetch released after changing nothing; crash's panic as stderr, its exit 2, and the next call afresh with no fetch; the code editor on the components page, its tokenizer's grammars Go's and JSON's alone, loaded lazily, every token the SDK fence's color in each palette and scheme, a palette with no syntax theme plain, two editors sharing the document's highlights, its accessibility tree, its gutter aligned in each space and type profile, wide and at a phone's width, read-only, value, and typing; its settings, long lines scrolled with the gutter held in place or wrapped, the tab size, following its settings and listening only while connected, the caret kept in view and the keyboard scrolling, and Shift+Tab's spaces by the tab size; paste through its own edit and drops refused; a read-only editor firing no single-key shortcut; the file tabs on the components page, their tablist, tabs, modified and read-only names, and the panel they control in the accessibility tree, the roving tabindex, Left and Right wrapping, Home and End, each requesting a select the page applies, a request no owner applies changing nothing, the marker following the editor's edits, the row scrolling at a phone's width with the focused and active tab in view and the page unscrolled, no row overflowing up or down, wide or at a phone's width, in each space and type, focus shown, no motion under reduced motion, and listening only to the set held while connected; the console on the components page, a log named Output that announces no write, Copy's status its only live region, stderr's cue said and seen, its text and an error's 4.5:1 on their tint in every palette and scheme, entries in arrival order with each stream's lines kept apart, control characters shown as text, long lines wrapped at a phone's width, exits and results, the latest 10,000 entries and the count dropped, held inside its frame, the empty state, following the tail and holding once scrolled up, Copy and Clear, 10,000 writes rendered in a few frames, focus shown, nothing moving, and listening only to the log held while connected; the timings on the components page, a table named by its caption with its column and row headers, only the run's phases in phase order and their total, the times to a tenth under 10 ms and whole from there, right-aligned in tabular numerals, no run yet said, fitting a phone's width, a new run replacing the last, listening only to the timings held while connected, and nothing moving; the controls on the components page, a toolbar of a Run group and, under editable-files, a separator and a Files group in the accessibility tree, the roving tabindex, Left and Right wrapping, Home and End, Enter and Space, availability following the file set and the run state, each control's request changing neither model and an unavailable one sending none, the New file and Rename forms anchored to their buttons, refused on submit, invalid and described by the set's reason, checked again as typed, Rename's stem selected, focus back on the button on a submit or Escape, the status saying only the run state's transitions, every button 24px a side in each space and type, wide and at a phone's width, at a phone's width each glyph alone, its name its hint on hover, and the groups whole in every space and type and a wide font, the names shown wider, nothing moving, and listening only to the models held while connected; the Go demo on the components page, running real Go over the page's one runner, no Go requested before a Run, a handler demo calling format with its file's text and its answer, line, and timings, a program demo running hello's main to its exit 0, a handler's error as the console's error block, Ctrl+Enter running only the demo it is pressed in, from its editor or its toolbar, Cmd+Enter as Ctrl+Enter, Alt or Shift with Enter running nothing, Help listing no Run after a run, the two-fence authoring error in the page and the accessibility tree with the fences shown and nothing run, Stop ending spin, format's Run stopping the other demo's pending spin with each console holding only its own output, New file selected with the editor focused, Rename, Delete focusing the tab now active, the last file kept, Reset restoring the file, the region and its parts in the accessibility tree with the fences out of it, hello's fence as cmd/hello/main.go holds it, the SDK's Shiki markup read and run, every fence shown without script, each demo fitting a phone's width, and every part of every demo inside it at 1280px, 1120px, either side of the 44rem side-by-side threshold, and a phone's width, the arrangement flipping there; and the screenshots command, its captures under a scratch TMPDIR removed after unless --keep, and a component's capture its section alone, the others hidden, its focus-start mark the first, a state at each of the SDK's widths, a run at one --width printing that width's tiles alone, and a width not among them a usage error; reads no network, writes dist/"
depends = ["preflight browser", "build"]
run = "BROWSER_EXECUTABLE=$(mise which chrome-headless-shell) node --test 'test/browser/*.test.ts'"
dir = "{{config_root}}"

[tasks.check]
description = "Run every check: lint, types, build, test:unit, and test:browser; reads no network, writes dist/ (gitignored) and nothing else outside TMPDIR and Go's caches"
depends = ["lint", "types", "build", "test:unit", "test:browser"]

# Never a dependency of check: a reviewer's look at the site's pages, not a test. The capture is
# spike-html-apps-tooling's spike-html-apps-screenshots, on scripts/screenshots.config.ts, run by
# scripts/screenshots.ts, which takes --width, a flag the bin doesn't know, and hands it to the
# capture file; the browser tier runs both (test/browser/screenshots.test.ts).
# Adapted from spike-html-apps-components (19d4f59): mise.toml, its screenshots task.
[tasks.screenshots]
description = "Capture the index whole at the SDK's widths, 390, 1120, and 1376px, also with Help and Settings open at each, and each component of the components page alone, --page components/<component>, its section whole at each of the same widths, light and dark, in tiles, at the defaults, or --palette/--space/--type <name>, or --all; --width <px> (one of 390, 1120, 1376) captures that width alone, the index's and each component's, any other a usage error; --page <name> (repeatable), --scheme light|dark, --output terminal|directory|browser, --dir <path>, --keep; reads no network, writes dist/ and the captures, under TMPDIR unless --dir"
depends = ["preflight browser", "build"]
# Its arguments follow the description, with or without a leading --.
# raw: with dependencies, mise prefixes a task's output through a pipe; icat needs the terminal.
raw = true
run = "BROWSER_EXECUTABLE=$(mise which chrome-headless-shell) node scripts/screenshots.ts"
dir = "{{config_root}}"

[tasks.install]
description = "Install every mise.toml pin, node_modules from pnpm-lock.yaml, and go.mod's requirements into the Go module cache; reads the network, writes node_modules/ and the module cache"
run = ["mise install", "pnpm install --frozen-lockfile", "go mod download"]
dir = "{{config_root}}"

# The SDK's currency bin, which a pnpm install links into node_modules/.bin; it replaces
# scripts/currency.sh, whose mise tool report it holds. Then go.mod's direct requirements,
# scripts/go-currency.ts. Both parts run whatever the first reports, and the task fails if either
# does.
[tasks.currency]
description = "Report every mise tool, package.json pin (a registry version or a github: tag), workflow action or reusable workflow pin, and go.mod direct requirement behind its latest, one line each, exiting nonzero if any; reads the network, writes nothing outside TMPDIR and Go's caches"
run = '''
status=0
pnpm exec spike-html-hosting-currency || status=$?
node scripts/go-currency.ts || status=$?
exit "$status"
'''
# Without mise's own command echo, so a current tree prints nothing at all.
quiet = true
dir = "{{config_root}}"

# Never a dependency of check: it reads the deployed site. test/unit/live.test.ts runs its
# assertions against local servers.
[tasks.live]
description = "Hold the deployed site, https://jaimestill.github.io/spike-html-go-wasm/ or the base URL given: the index 200 as text/html, and go/hello.wasm 200 as application/wasm and gzip-encoded when gzip is accepted, one line each, exiting nonzero naming each failed one; reads the network, writes nothing"
# Its one argument, the base URL, follows the description.
run = "node scripts/live.ts"
dir = "{{config_root}}"
