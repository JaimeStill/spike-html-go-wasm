[tasks."report:programs"]
description = "Report, never a gate, each playground program's, the sqlate page's program's, and the graph page's program's cold phase timings from a fresh worker and an empty cache, its warm timings after an edit to main.go, and its closure's archives, count, bytes as fetched, and gzip bytes, as test/browser/playground-report.test.ts's diagnostics, after the build; reads no network, writes dist/"
depends = ["preflight browser", "build"]
run = "BROWSER_EXECUTABLE=$(mise which chrome-headless-shell) node --test test/browser/playground-report.test.ts"
dir = "{{config_root}}"

[tasks.check]
description = "Run every check: lint, types, build, test:unit, and test:browser; reads no network, writes dist/ (gitignored) and nothing else outside TMPDIR and Go's caches"
depends = ["lint", "types", "build", "test:unit", "test:browser"]

# Never a dependency of check: a reviewer's look at the site's pages, not a test. The capture is
# spike-html-apps-tooling's spike-html-apps-screenshots, on scripts/screenshots.config.ts, run by
# scripts/screenshots.ts, which takes --width, a flag the bin doesn't know, and hands it to the
# capture file; the browser tier runs both (test/browser/screenshots.test.ts).
# Adapted from spike-html-apps-components (19d4f59): mise.toml, its screenshots task.
[tasks.screenshots]
description = "Capture the index whole at the SDK's widths, 390, 1120, and 1376px, also with Help and Settings open at each, and each component of the components page alone, --page components/<component>, its section whole at each of the same widths, and the playground's viewport, --page playground, its one screen, at 390px with the Output and then the Timings tab, 900px, 1120px and 1376px each in editor left, top, and right and with the Layout menu open, and 1376px with the About dialog open, and 390px, 1120px, and 1376px each with each of Basics, Generics, Concurrency, and Standard library chosen in the Program select, and the sqlate page's viewport, --page sqlate, and each rendered Markdown page whole, --page sqlate-compile, --page go-core-graph, and --page go-web-sdk-handlers, each at the SDK's widths, light and dark, in tiles, at the defaults, or --palette/--space/--type <name>, or --all; --width <px> (one of 390, 1120, 1376) captures that width alone, the index's and each component's, any other a usage error; --page <name> (repeatable), --scheme light|dark, --output terminal|directory|browser, --dir <path>, --keep; reads no network, writes dist/ and the captures, under TMPDIR unless --dir"
depends = ["preflight browser", "build"]
# Its arguments follow the description, with or without a leading --.
# raw: with dependencies, mise prefixes a task's output through a pipe; icat needs the terminal.
raw = true
run = "BROWSER_EXECUTABLE=$(mise which chrome-headless-shell) node scripts/screenshots.ts"
dir = "{{config_root}}"

[tasks.install]
description = "Install every mise.toml pin, node_modules from pnpm-lock.yaml, and go.mod's requirements into the Go module cache, with the modules the check's go mod tidy -diff reads besides, the ones only the requirements' own tests import; reads the network, writes node_modules/ and the module cache"
# go mod download fetches only what the main module's packages build and test with; go mod tidy
# also reads the modules the requirements' own tests import (pgx's testify and puddle), so its
# -diff run here fetches them while the network is allowed, writing nothing, and the check's
# GOPROXY=off tidy finds them cached.
run = ["mise install", "pnpm install --frozen-lockfile", "go mod download", "go mod tidy -diff"]
dir = "{{config_root}}"

# The SDK's currency bin, which a pnpm install links into node_modules/.bin; it replaces
# scripts/currency.sh, whose mise tool report it holds. Then go.mod's direct requirements,
# scripts/go-currency.ts. Both parts run whatever the first reports, and the task fails if either
# does.
[tasks.currency]
description = "Report every mise tool, package.json pin (a registry version or a github: tag), workflow action or reusable workflow pin, and go.mod direct requirement behind its latest, one line each, exiting nonzero if any; reads the network, writes nothing outside TMPDIR and Go's caches"
run = '''
status=0
pnpm exec spike-html-hosting-currency || status=$?
node scripts/go-currency.ts || status=$?
exit "$status"
'''
# Without mise's own command echo, so a current tree prints nothing at all.
quiet = true
dir = "{{config_root}}"

# Never a dependency of check: it reads the deployed site. test/unit/live.test.ts runs its
# assertions against local servers.
[tasks.live]
description = "Hold the deployed site, https://jaimestill.github.io/spike-html-go-wasm/ or the base URL given: the index 200 as text/html, go/hello.wasm 200 as application/wasm and gzip-encoded when gzip is accepted, go/toolchain/manifest.json 200, and the compiler it names 200 as application/wasm and gzip-encoded when gzip is accepted, one line each, exiting nonzero naming each failed one; reads the network, writes nothing"
# Its one argument, the base URL, follows the description.
run = "node scripts/live.ts"
dir = "{{config_root}}"

# Never a dependency of check: it reads the deployed site and gh, and reports, never judging a
# number. scripts/measure.ts holds what it reads and how; test/unit/measure.test.ts runs its pure
# parts, scripts/measure-report.ts, on fixtures.
[tasks.measure]
description = "Measure the deployed site, https://jaimestill.github.io/spike-html-go-wasm/ or the base URL given, and print its evidence, never judging a number: the deployed commit, from the live go/hello.wasm's vcs.revision and, for the Pages URL, gh's latest successful github-pages deployment, and the date; a size table, one row per prebuilt module, hello, probe, sqlate, and websdk, per toolchain module, the compiler and the linker the live manifest names, and per program the site builds in the page, calc, basics, generics, concurrency, stdlib, sqlate, and graph, its closure's archives against the live manifest, each row its raw bytes, its bytes as served for a browser's Accept-Encoding, and its bytes at brotli 11, and a closure's its file count, the requests a revalidation makes once max-age expires; and a drift report, each prebuilt module built twice by scripts/build-go-modules.sh into TMPDIR with a GOCACHE of its own, the two builds against each other and the live module against the first, byte for byte, each difference's byte counts and differing build settings; and desktop timings, one table per demo page, the components page, the Markdown pages, sqlate-compile, go-web-sdk-handlers, and go-core-graph, the sqlate page, and the playground once per program, each read in the pinned chrome-headless-shell with the network allowed, cold, a fresh profile, cached, a fresh page and worker within max-age, and in place, a further Run on the held worker, a scenario switch, a rerun, an edit to main.go rebuilt, or a program switch: the page's first-contentful-paint, whether any .wasm was requested before Run, Run's click to the first output, the run's phases as the demo's timings show them and their total, and the bytes transferred during the run, each the median and max of five readings; --readings N sets the readings, 0 for no timings, --pages a,b the pages, by key, and --skip-sizes leaves out the sizes and the drift; exits nonzero only when an argument can't be taken, the manifest can't be read, or the local build fails; reads the network and gh, writes nothing outside TMPDIR"
depends = ["preflight browser"]
# Its arguments follow the description: the base URL, and --readings N, --pages a,b, and
# --skip-sizes. BROWSER_EXECUTABLE names the pinned chrome-headless-shell, the browser tier's,
# which scripts/measure-timings.ts runs with the network allowed.
run = "BROWSER_EXECUTABLE=$(mise which chrome-headless-shell) node scripts/measure.ts"
dir = "{{config_root}}"
